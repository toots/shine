name: Build and install

on:
  push:
    branches: [ "main" ]
  pull_request:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install required packages  on macos
      if: matrix.os == 'macos-latest'
      run: brew install autoconf automake libtool pkg-config
    - name: Install required packages on ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get -y install automake autoconf pkg-config ffmpeg
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check || (cat tests/*.log; exit 1)
    - name: make distcheck
      if: matrix.os == 'ubuntu-latest'
      run: make distcheck
    - name: make install
      run: sudo make install
    - name: Test pkg-config setup
      run: pkg-config --libs shine
      
  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install required packages
      run: sudo apt-get -y install automake autoconf pkg-config clang
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: >
        ./configure CC=clang
        CFLAGS="-g -O1 -Werror -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
        LDFLAGS="-fsanitize=address,undefined"
    - name: make check
      run: make check || (cat tests/*.log; exit 1)

  cross-arch:
    # 32-bit and big endian hosts, emulated: the golden hashes must match.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm/v7, linux/s390x]
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-qemu-action@v4
    - name: make check
      run: >
        docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/src" -w /src
        debian:stable-slim sh -c
        "apt-get update -qq &&
        apt-get install -y -qq --no-install-recommends gcc make autoconf automake libtool > /dev/null &&
        ./bootstrap && ./configure && make check || (cat tests/*.log; exit 1)"

  fixed-point:
    # arm64: -mgeneral-regs-only turns floating point into soft-float calls.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install required packages
      run: brew install autoconf automake libtool pkg-config
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure CFLAGS="-O2 -mgeneral-regs-only"
    - name: Build the library
      run: make libshine.la
    - name: Check the library uses no floating point
      run: tools/check-no-float.sh .libs/libshine.a

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install pre-commit
      run: pipx install pre-commit
    - name: Check formatting
      run: pre-commit run --all-files --show-diff-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install required packages
      run: sudo apt-get -y install automake autoconf libtool pkg-config clang lld wasi-libc nodejs
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure --enable-wasm
    - name: make check-wasm
      run: make check-wasm
