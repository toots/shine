name: Build and install

on:
  push:
    branches: [ "main" ]
  pull_request:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
    - uses: actions/checkout@v3
    - name: Install required packages  on macos
      if: matrix.os == 'macos-latest'
      run: brew install autoconf automake libtool pkg-config
    - name: Install required packages on ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get -y install automake autoconf pkg-config
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check || (cat tests/*.log; exit 1)
    - name: make distcheck
      if: matrix.os == 'ubuntu-latest'
      run: make distcheck
    - name: make install
      run: sudo make install
    - name: Test pkg-config setup
      run: pkg-config --libs shine
      
  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install required packages
      run: sudo apt-get -y install automake autoconf pkg-config clang
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: >
        ./configure CC=clang
        CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
        LDFLAGS="-fsanitize=address,undefined"
    - name: make check
      run: make check || (cat tests/*.log; exit 1)

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install required packages
      run: sudo apt-get -y install automake autoconf libtool pkg-config clang lld wasi-libc nodejs
    - name: bootstrap
      run: ./bootstrap
    - name: configure
      run: ./configure --enable-wasm
    - name: make check-wasm
      run: make check-wasm
